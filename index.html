<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kei Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style id="app-style">
/* Layout: soft blue hero with a wave edge, a sticky filter bar, then tappable opsi cards. A bottom dock holds the cart bar (and the owner's save bar). Ordering and payment are full-page views (merged onto saved opsi data). */
:root{
  --bg:#F3F8FE; --surface:#FFFFFF; --surface2:#E8F1FD; --ink:#13294B; --muted:#586B8A; --line:#D5E2F4;
  --blue:#386BD0; --blue-ink:#FFFFFF; --blue-soft:#DCE8FB; --hero-a:#D9E7FB; --hero-b:#F3F8FE;
  --danger:#B93B4D; --danger-soft:#FBE4E8; --ok:#237A5E;
  --t1:#DCE9FB; --t1i:#4A7FE0; --t2:#D2F0E3; --t2i:#3FAE86; --t3:#FFE0D0; --t3i:#EE8458;
  --t4:#FFF1C2; --t4i:#E0AB25; --t5:#E6DEFB; --t5i:#8A6FD6; --t6:#FBD9E3; --t6i:#E0668C;
  --shadow:0 1px 2px rgba(19,41,75,.06),0 10px 28px rgba(56,107,208,.08);
  --overlay:rgba(12,23,48,.45);
  --font-display:'Bricolage Grotesque','Avenir Next','Trebuchet MS',sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1730; --surface:#14233F; --surface2:#1A2D50; --ink:#E6EEFF; --muted:#9DB0D3; --line:#263A60;
  --blue:#7FA8F5; --blue-ink:#0C1730; --blue-soft:#1F3764; --hero-a:#16294D; --hero-b:#0C1730;
  --danger:#FF8A98; --danger-soft:#3A2030; --ok:#6FD3B0;
  --t1:#1F3763; --t1i:#8BB2F7; --t2:#17403A; --t2i:#6FD3B0; --t3:#4A2E25; --t3i:#F5A383;
  --t4:#4A3E18; --t4i:#F0C85A; --t5:#35295C; --t5i:#B7A2F2; --t6:#4A2434; --t6i:#F08FB0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1730; --surface:#14233F; --surface2:#1A2D50; --ink:#E6EEFF; --muted:#9DB0D3; --line:#263A60;
  --blue:#7FA8F5; --blue-ink:#0C1730; --blue-soft:#1F3764; --hero-a:#16294D; --hero-b:#0C1730;
  --danger:#FF8A98; --danger-soft:#3A2030; --ok:#6FD3B0;
  --t1:#1F3763; --t1i:#8BB2F7; --t2:#17403A; --t2i:#6FD3B0; --t3:#4A2E25; --t3i:#F5A383;
  --t4:#4A3E18; --t4i:#F0C85A; --t5:#35295C; --t5i:#B7A2F2; --t6:#4A2434; --t6i:#F08FB0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.6);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-top:0;padding-bottom:var(--dock-h,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.inner{max-width:1000px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* Hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--hero-a),var(--hero-b))}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:220px;height:220px;right:-70px;top:-80px;background:var(--t3);opacity:.55}
.hero::after{width:150px;height:150px;left:-50px;bottom:30px;background:var(--t2);opacity:.6}
.hero .inner{position:relative;z-index:1;padding-block:14px 8px}
.hero-top{display:flex;justify-content:flex-end;min-height:44px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center;padding-block:10px 22px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,9vw,4rem);line-height:1.02;letter-spacing:-.02em;margin-block:6px 10px;text-wrap:balance;overflow-wrap:anywhere}
.tagline{font-size:1.08rem;color:var(--muted);max-width:34ch;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.count{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem;font-weight:600}
.hero-art{display:none}
.hero-art svg{width:100%;height:auto;max-width:340px;display:block;margin-inline:auto}
.wave{display:block;width:100%;height:36px;margin-top:-1px}
@media (min-width:720px){
  .hero-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  .hero-art{display:block}
}

/* Sticky bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .inner{padding-block:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.admin-bar{background:var(--blue-soft);border-bottom:1px solid var(--line)}
.admin-bar .inner{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px}
.admin-label{font-weight:700;font-size:.9rem;margin-right:auto;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}

/* Buttons */
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--blue)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn-sm{min-height:40px;padding:0 14px;font-size:.92rem;border-radius:10px}
.btn-lg{min-height:54px;font-size:1.05rem;width:100%;border-radius:16px}
.btn[disabled]{opacity:.6;cursor:default}

/* Opsi */
main .inner{padding-block:22px 40px;display:flex;flex-direction:column;gap:28px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sec-head h2{font-family:var(--font-display);font-weight:700;font-size:1.6rem;letter-spacing:-.01em}
.sec-head .n{font-size:.9rem;color:var(--muted);font-weight:600}
.sec-head .btn{margin-left:auto}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:12px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.card:has(.pick:not([disabled])):hover{border-color:var(--blue)}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;border-radius:12px}
.pick[disabled]{cursor:default}
.card.is-sold .tile,.card.is-sold .info,.card.is-sold .right{opacity:.55}
.tile{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--tb)}
.tile svg{width:44px;height:44px}
.tone-1{--tb:var(--t1);--ti:var(--t1i)}.tone-2{--tb:var(--t2);--ti:var(--t2i)}.tone-3{--tb:var(--t3);--ti:var(--t3i)}
.tone-4{--tb:var(--t4);--ti:var(--t4i)}.tone-5{--tb:var(--t5);--ti:var(--t5i)}.tone-6{--tb:var(--t6);--ti:var(--t6i)}
.info{min-width:0}
.nm{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.nm .h3{display:block;font-family:var(--font-display);font-weight:650;font-size:1.12rem;line-height:1.25;overflow-wrap:anywhere}
.ds{color:var(--muted);font-size:.92rem;margin-top:2px;overflow-wrap:anywhere}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--blue)}
.add{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:1.25rem;line-height:1}
.add.on{background:var(--blue);color:var(--blue-ink);font-size:1rem}
.pill{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--danger-soft);color:var(--danger);padding:2px 8px;border-radius:999px}
.admin-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.confirm-text{font-size:.92rem;font-weight:600;color:var(--danger);margin-right:auto}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:24px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
footer .inner{padding-block:8px 36px;color:var(--muted);font-size:.88rem}

/* Bottom dock: cart bar + owner save bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(19,41,75,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .inner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:12px}
.cartbar+.savebar{border-top:1px solid var(--line)}
.cb-info{display:flex;flex-direction:column;min-width:0}
.cb-n{font-size:.85rem;color:var(--muted);font-weight:600}
.cb-t{font-family:var(--font-display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.cartbar .btn{min-width:130px}
.savebar p{font-weight:600;min-width:0}
.savebar .note{display:block;font-weight:400;color:var(--muted);font-size:.88rem}
.savebar .btns{display:flex;gap:8px;flex-wrap:wrap}

/* Modal */
.overlay{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{width:100%;max-width:480px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.overlay{align-items:center;padding:20px}.sheet{border-radius:24px}}
.sheet h2{font-family:var(--font-display);font-weight:700;font-size:1.4rem;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:.92rem;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>.lbl{font-weight:600;font-size:.92rem}
.hint{font-weight:400;color:var(--muted)}
.input{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
textarea.input{padding:10px 14px;min-height:72px;resize:vertical}
.input:focus{border-color:var(--blue);outline:2px solid var(--blue);outline-offset:0}
.seg{display:flex;gap:8px}
.seg label{flex:1}
.seg input,.swatches input,.pm input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;min-height:44px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;font-weight:600;cursor:pointer;background:var(--bg)}
.seg input:checked+span{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.seg input:focus-visible+span,.swatches input:focus-visible+span,.pm input:focus-visible+.pm-card{outline:3px solid var(--blue);outline-offset:2px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches span{display:block;width:44px;height:44px;border-radius:14px;background:var(--tb);border:3px solid transparent;cursor:pointer}
.swatches span::after{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--ti);margin:11px auto 0}
.swatches input:checked+span{border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;font-weight:600;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--blue)}
.err{color:var(--danger);font-size:.9rem;font-weight:600;min-height:1.3em;margin-bottom:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:84px}
.pw-toggle{position:absolute;right:6px;top:5px;min-height:36px;padding:0 12px;border-radius:9px;border:0;background:transparent;color:var(--blue);font-weight:700;cursor:pointer}

/* Quantity sheet */
.q-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.q-head .tile{flex:none}
.q-head h2{margin-bottom:2px;overflow-wrap:anywhere}
.q-head .sub{margin:0}
.q-price{font-weight:700;color:var(--blue);margin-top:2px}
.q-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.step-btn{width:48px;height:48px;border:0;background:transparent;font-size:1.5rem;font-weight:600;cursor:pointer;color:var(--blue);border-radius:14px;line-height:1}
.stepper output{min-width:48px;text-align:center;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stepper.sm .step-btn{width:40px;height:40px;font-size:1.25rem}
.stepper.sm output{min-width:34px;font-size:1rem}
.q-sub{font-family:var(--font-display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}

/* Payment page */
.pay-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.pay-bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.pay-shop{font-family:var(--font-display);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pay-wrap{max-width:680px;display:flex;flex-direction:column;gap:16px;padding-block:20px 48px}
.pay-title{font-family:var(--font-display);font-weight:800;font-size:2rem;letter-spacing:-.02em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.panel h2{font-family:var(--font-display);font-weight:700;font-size:1.2rem;margin-bottom:12px}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:12px;border-top:1px solid var(--line)}
.line:first-child{border-top:0;padding-top:0}
.l-info{flex:1 1 140px;min-width:0;display:flex;flex-direction:column}
.l-name{font-weight:700;overflow-wrap:anywhere}
.l-each{font-size:.88rem;color:var(--muted)}
.l-sub{font-weight:700;font-variant-numeric:tabular-nums;min-width:84px;text-align:right}
.total-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:2px solid var(--line);padding-top:12px;margin-top:4px}
.total-row strong{font-family:var(--font-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.fine{font-size:.88rem;color:var(--muted);margin-top:8px}
.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border:0;padding:0;margin:0;min-width:0}
.methods legend{padding:0;font-weight:600;font-size:.92rem;margin-bottom:10px}
.pm{position:relative;display:block}
.pm-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:100px;padding:12px 6px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);cursor:pointer;text-align:center}
.pm-card svg{width:30px;height:30px;color:var(--blue)}
.pm-t{font-weight:700}
.pm-s{font-size:.78rem;color:var(--muted);line-height:1.25}
.pm input:checked+.pm-card{border-color:var(--blue);background:var(--blue-soft)}
.detail{margin-top:14px;padding:14px;border-radius:14px;background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.d-lbl{font-weight:600}
.d-sub{font-size:.92rem;color:var(--muted)}
.acct-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.acct{font-family:var(--font-display);font-size:1.4rem;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.qr{width:100%;max-width:260px;display:block;margin-inline:auto;border-radius:12px;background:#fff;padding:8px}
.confirm{display:flex;flex-direction:column;gap:8px}
.done{align-items:center;text-align:center;gap:14px;padding-top:40px}
.done-icon{width:72px;height:72px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.done-icon svg{width:36px;height:36px}
.done h1{font-family:var(--font-display);font-weight:800;font-size:1.8rem;letter-spacing:-.01em}
.done p{color:var(--muted);max-width:42ch}
.done .stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px;margin-top:6px}

/* Owner payment settings */
.qr-prev{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qr-prev img{width:96px;height:96px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--line)}
.file{font-size:.92rem;max-width:100%}

/* Category manager */
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding-bottom:12px;margin-bottom:12px;border-bottom:1px dashed var(--line)}
.cat-row .cat-name{grid-column:1/-1}
.cat-btns{display:flex;gap:6px}
.btn-icon{min-width:40px;padding:0 10px}
select.input{padding:0 10px}
.cat-del{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cat-subs{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--surface2)}
.lbl-sm{font-weight:600;font-size:.85rem;color:var(--muted)}
.sub-row{display:flex;gap:8px;align-items:center}
.sub-row .input{min-height:40px}
.sub-block{margin-top:18px}
.sub-head{font-family:var(--font-display);font-weight:650;font-size:1.1rem;margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.sub-head .n{font-size:.85rem;color:var(--muted);font-weight:600}
.sub-empty{margin-bottom:6px}
.tabs.subtabs{margin-top:8px}
.subtabs .tab{min-height:36px;padding:0 14px;font-size:.92rem}

/* Intro, navbar, category grid, drawer */
.intro{position:relative;overflow:hidden;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:32px max(20px,env(safe-area-inset-left,0px));text-align:center;background:linear-gradient(180deg,var(--hero-a),var(--hero-b))}
.intro::before,.intro::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.intro::before{width:260px;height:260px;right:-90px;top:-70px;background:var(--t3);opacity:.55}
.intro::after{width:200px;height:200px;left:-70px;bottom:-40px;background:var(--t2);opacity:.6}
.intro>*{position:relative;z-index:1}
.wel{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(2.2rem,13vw,4.8rem);line-height:1.08;letter-spacing:.02em}
.wel .w{display:block}
.wel .ch{display:inline-block;animation:chIn .7s cubic-bezier(.2,.9,.3,1.25) both,chBob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*70ms),calc(var(--i)*70ms + 1s)}
.wel .ch:nth-child(3n+1){color:var(--blue)}
.intro-eb{animation:fadeUp .6s ease both}
.intro-btn{width:auto;min-width:200px;padding:0 36px;animation:fadeUp .6s ease both;animation-delay:1.4s}
@keyframes chIn{from{opacity:0;transform:translateY(.8em) scale(.5) rotate(-10deg)}}

function readImg(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var out='';
        [[560,.82],[420,.7],[320,.6]].some(function(p){
          var sc=Math.min(1,p[0]/Math.max(img.width,img.height)),c=document.createElement('canvas');
          c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
          var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
          out=c.toDataURL('image/jpeg',p[1]);
          return out.length<=180000;
        });
        if(out.length>180000)return rej(new Error('big'));
        res(out);
      };
      img.onerror=function(){rej(new Error('img'))};
      img.src=fr.result;
    };
    fr.onerror=function(){rej(new Error('read'))};
    fr.readAsDataURL(file);
  });
}

/* ---------- transactions, stats, history (owner only) ---------- */
var DAY=86400000;
var PERIODS=[['all','Semua'],['today','Hari ini'],['7','7 hari'],['30','30 hari']];
function periodStart(){
  var n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  if(period==='today')return d0;
  if(period==='7'||period==='30')return d0-(parseInt(period,10)-1)*DAY;
  return 0;
}
function txList(){var st=periodStart();return (data().tx||[]).filter(function(x){return x.t>=st}).sort(function(a,b){return b.t-a.t})}
function fmtDate(t){return new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}
function fmtTime(t){return new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':')}
function lineRev(l){return l.price!=null?l.price*l.q:0}
function txTotal(x){return x.lines.reduce(function(s,l){return s+lineRev(l)},0)}
function txQty(x){return x.lines.reduce(function(s,l){return s+l.q},0)}
function shortRp(n){return n>=1000000?(Math.round(n/100000)/10)+'jt':n>=1000?Math.round(n/1000)+'rb':String(n)}
function newTxId(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function snapLine(it,q){
  var c=catById(it.cat),sub=((c&&c.subs)||[]).filter(function(x){return x.id===it.sub})[0];
  return {id:it.id,name:it.name,cat:it.cat,catName:c?c.name:'',sub:sub?sub.id:'',subName:sub?sub.name:'',price:it.price,q:q};
}
function recordTx(){
  var T=totals();if(!T.cnt)return render();
  var x={id:newTxId(),t:Date.now(),lines:T.L.map(function(l){return snapLine(l.it,l.q)}),who:buyer.trim(),src:'order'};
  mutate(function(s){s.tx.push(x)});
}
function periodBar(){
  return '<div class="tabs subtabs" role="group" aria-label="Periode">'+PERIODS.map(function(p){return '<button type="button" class="tab" data-act="period" data-p="'+p[0]+'" aria-pressed="'+(period===p[0])+'">'+p[1]+'</button>'}).join('')+'</div>';
}
function metricBar(){
  return '<div class="tabs subtabs" role="group" aria-label="Metrik grafik">'+[['rev','Pendapatan'],['qty','Jumlah terjual']].map(function(m){return '<button type="button" class="tab" data-act="metric" data-m="'+m[0]+'" aria-pressed="'+(statMetric===m[0])+'">'+m[1]+'</button>'}).join('')+'</div>';
}
function aggregate(list){
  var A={cats:{},subs:{},opts:{},rev:0,qty:0,n:list.length};
  list.forEach(function(x){
    x.lines.forEach(function(l){
      var r=lineRev(l),sk=l.cat+'|'+(l.sub||'');
      A.rev+=r;A.qty+=l.q;
      var c=A.cats[l.cat]||(A.cats[l.cat]={rev:0,qty:0,name:l.catName});c.rev+=r;c.qty+=l.q;
      var s=A.subs[sk]||(A.subs[sk]={rev:0,qty:0,name:l.subName});s.rev+=r;s.qty+=l.q;
      var o=A.opts[sk]||(A.opts[sk]={}),oo=o[l.id]||(o[l.id]={name:l.name,q:0});oo.q+=l.q;oo.name=l.name;
    });
  });
  return A;
}
function catRows(A){
  var rows=[],seen={};
  data().cats.forEach(function(c,i){seen[c.id]=1;var a=A.cats[c.id]||{rev:0,qty:0};rows.push({name:c.name,rev:a.rev,qty:a.qty,tone:i%6+1})});
  Object.keys(A.cats).forEach(function(k){if(!seen[k])rows.push({name:A.cats[k].name||'Kategori dihapus',rev:A.cats[k].rev,qty:A.cats[k].qty,tone:6})});
  return rows;
}
function subRowsFor(c,ci,A){
  var rows=[],seen={};
  c.subs.forEach(function(s,j){var k=c.id+'|'+s.id;seen[k]=1;var a=A.subs[k]||{rev:0,qty:0};rows.push({key:k,name:s.name,rev:a.rev,qty:a.qty,tone:(j+ci)%6+1})});
  Object.keys(A.subs).forEach(function(k){if(k.indexOf(c.id+'|')===0&&!seen[k]){var a=A.subs[k];rows.push({key:k,name:a.name||'Tanpa sub-kategori',rev:a.rev,qty:a.qty,tone:6})}});
  return rows;
}
function barsHtml(rows){
  var key=statMetric,max=0;
  rows.forEach(function(r){if(r[key]>max)max=r[key]});
  return '<ul class="bars">'+rows.map(function(r){
    var w=max?Math.max(r[key]?3:0,Math.round(r[key]/max*100)):0;
    return '<li class="bar-row tone-'+r.tone+'"><span class="bar-name">'+esc(r.name)+'</span><span class="bar-val">'+(key==='rev'?rp(r.rev):r.qty+'x')+'</span><span class="bar-track"><span class="bar-fill" style="width:'+w+'%"></span></span></li>';
  }).join('')+'</ul>';
}
function trendHtml(){
  var n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),cols=[],i;
  for(i=6;i>=0;i--)cols.push({t:d0-i*DAY,rev:0,qty:0});
  (data().tx||[]).filter(isDone).forEach(function(x){
    var idx=Math.floor((x.t-cols[0].t)/DAY);
    if(idx>=0&&idx<7)x.lines.forEach(function(l){cols[idx].rev+=lineRev(l);cols[idx].qty+=l.q});
  });
  var key=statMetric,max=0;
  cols.forEach(function(c){if(c[key]>max)max=c[key]});
  return '<div class="trend">'+cols.map(function(c){
    var hg=max?Math.max(c[key]?4:0,Math.round(c[key]/max*100)):0,lab=new Date(c.t).toLocaleDateString('id-ID',{weekday:'short'});
    return '<div class="tr-col"><span class="tr-v">'+(key==='rev'?(c.rev?shortRp(c.rev):''):(c.qty||''))+'</span><span class="tr-bar"><span class="tr-fill" style="height:'+hg+'%"></span></span><span class="tr-l">'+esc(lab)+'</span></div>';
  }).join('')+'</div>';
}
function top3(key,A){
  var o=A.opts[key]||{};
  return Object.keys(o).map(function(k){return o[k]}).sort(function(a,b){return b.q-a.q}).slice(0,3);
}
function topHtml(A){
  var h='';
  data().cats.forEach(function(c,ci){
    var groups=c.subs.length?subRowsFor(c,ci,A).map(function(r){return {title:r.name,key:r.key}}):[{title:c.name,key:c.id+'|'}];
    groups.forEach(function(g){
      var t=top3(g.key,A);
      h+='<div class="top-card"><div class="top-h"><span class="top-t">'+esc(g.title)+'</span>'+(c.subs.length?'<span class="top-c">'+esc(c.name)+'</span>':'')+'</div>';
      h+=t.length?'<ol class="top-l">'+t.map(function(o){return '<li><div class="top-row"><span class="top-n">'+esc(o.name)+'</span><span class="top-q">'+o.q+'x dibeli</span></div></li>'}).join('')+'</ol>':'<p class="hint">Belum ada penjualan.</p>';
      h+='</div>';
    });
  });
  return h;
}

    h+='<section><div class="sec-head"><h2>Paling sering dibeli</h2></div><div class="top-grid">'+topHtml(A)+'</div></section>';
  }
  paint(h+'</div></main>'+footerHtml()+dockHtml());

function txCard(x){
  var h='<li class="card tx"><div class="tx-top"><div><span class="tx-date">'+esc(fmtDate(x.t))+'</span><span class="tx-time">Pukul '+esc(fmtTime(x.t))+'</span></div><span class="pr">'+rp(txTotal(x))+'</span></div>';
  h+='<ul class="tx-lines">'+x.lines.map(function(l){
    return '<li><span class="tx-i">'+esc(l.catName||'Kategori')+' › '+(l.subName?esc(l.subName)+' › ':'')+'<b>'+esc(l.name)+'</b> × '+l.q+'</span><span class="tx-p">'+(l.price!=null?rp(l.price*l.q):'-')+'</span></li>';
  }).join('')+'</ul>';
  h+='<p class="tx-meta">'+txQty(x)+' item'+(x.who?' · '+esc(x.who):'')+' · '+(x.src==='manual'?'Dicatat manual':'Pesanan website')+(x.code?' · <b>'+esc(x.code)+'</b>':'')+(x.method?' · '+esc(methodLabel(x.method)):'')+' · '+(x.status==='pending'?'<b>Menunggu konfirmasi</b>':x.status==='rejected'?'<b style="color:var(--danger)">Pembayaran ditolak</b>':'Selesai')+'</p>';
  if(x.note)h+='<p class="tx-meta">Catatan: '+esc(x.note)+'</p>';
  if(x.status==='rejected'&&x.rejectNote)h+='<p class="tx-meta">Alasan ditolak: '+esc(x.rejectNote)+'</p>';
  if(x.proof)h+='<p class="tx-meta"><button type="button" class="btn btn-sm" data-act="proof-view" data-id="'+x.id+'">Lihat bukti bayar</button></p>';
  h+='<div class="admin-row">';
  if(x.status==='pending')h+='<button class="btn btn-sm btn-primary" data-act="tx-done" data-id="'+x.id+'">Tandai selesai</button><button class="btn btn-sm btn-danger" data-act="tx-reject" data-id="'+x.id+'">Tolak pembayaran</button>';
  if(txConfirmId===x.id)h+='<span class="confirm-text">Hapus transaksi ini?</span><button class="btn btn-sm btn-danger" data-act="tx-del-yes" data-id="'+x.id+'">Ya, hapus</button><button class="btn btn-sm" data-act="tx-del-no">Batal</button>';
  else h+='<button class="btn btn-sm btn-danger" data-act="tx-del" data-id="'+x.id+'">Hapus</button>';
  return h+'</div></li>';
}

  h+=list.length?'<ul class="tx-list" style="margin-top:14px">'+list.map(txCard).join('')+'</ul>':'<ul class="list" style="margin-top:14px"><li class="empty"><span>Belum ada transaksi di periode ini.</span></li></ul>';
  paint(h+'</section></div></main>'+footerHtml()+dockHtml());

function txOptions(cur){
  var h='<option value="">Pilih opsi…</option>',items=data().items;
  data().cats.forEach(function(c){
    var groups=c.subs.map(function(s){return {label:c.name+' › '+s.name,items:items.filter(function(i){return i.cat===c.id&&i.sub===s.id})}});
    var rest=items.filter(function(i){return i.cat===c.id&&!c.subs.some(function(s){return s.id===i.sub})});
    if(rest.length)groups.push({label:c.name+(c.subs.length?' › Tanpa sub-kategori':''),items:rest});
    groups.forEach(function(g){
      if(!g.items.length)return;
      h+='<optgroup label="'+esc(g.label)+'">'+g.items.map(function(i){return '<option value="'+i.id+'"'+(cur===i.id?' selected':'')+'>'+esc(i.name)+(i.price!=null?' — '+rp(i.price):'')+'</option>'}).join('')+'</optgroup>';
    });
  });
  return h;
}
function txRowsHtml(){
  return txTmp.map(function(r,i){
    return '<div class="tx-row"><select class="input" data-tx-item="'+i+'" aria-label="Opsi">'+txOptions(r.id)+'</select><input class="input tx-q" type="number" min="1" max="99" inputmode="numeric" data-tx-q="'+i+'" value="'+r.q+'" aria-label="Jumlah">'+(txTmp.length>1?'<button type="button" class="btn btn-sm btn-icon" data-act="txrow-del" data-i="'+i+'" aria-label="Hapus baris">✕</button>':'<span></span>')+'</div>';
  }).join('');
}
function txSum(){return txTmp.reduce(function(s,r){var it=r.id?itemById(r.id):null;return s+(it&&it.price!=null?it.price*(parseInt(r.q,10)||0):0)},0)}

function renderTxRows(){var e=document.getElementById('tx-rows');if(e)e.innerHTML=txRowsHtml();updateTxSum()}

async function refreshSite(){
  if(!sb)return;
  try{var r=await sb.from('kp_shop').select('*').eq('id',1).maybeSingle();if(r.data){siteClosed=!!r.data.closed;siteMsg=r.data.closed_msg||''}}catch(e){}
}
async function enterSite(){
  await refreshSite();
  view=(siteClosed&&!loggedIn)?'closed':'home';
  render();toTop();
}
async function checkSite(){
  if(loggedIn||!sb)return;
  var was=siteClosed;await refreshSite();
  if(siteClosed&&!was&&view!=='intro'&&view!=='done'&&view!=='closed')render();
}
setInterval(checkSite,15000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkSite()});

function render(){
  applyFavicon();
  if(loggedIn&&view==='closed')view='home';
  if(siteClosed&&!loggedIn&&view!=='intro'&&view!=='done'&&view!=='closed'){
    view='closed';curCat='';curSub='';
    if(modal&&modal!=='login')closeModal();
    if(location.hash==='#pembayaran')go('');
  }
  if(view==='closed')return renderClosed();
  if((view==='stats'||view==='hist')&&!loggedIn)view='home';
  if(view==='stats')return renderStats();
  if(view==='hist')return renderHist();
  if(view==='pay')return renderPay();
  if(view==='done')return renderDone();
  if(view==='intro')return renderIntro();
  var c=catById(curCat);

  if(view==='items'&&c&&c.subs.length&&curSub!=='_none'&&!c.subs.some(function(x){return x.id===curSub}))view='cat';

}

function readLogo(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var sc=Math.min(1,400/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
        var x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
        var out=c.toDataURL('image/png');
        if(out.length>300000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);out=c.toDataURL('image/jpeg',.85)}
        if(out.length>500000)return rej(new Error('big'));
        res(out);
      };
      img.onerror=function(){rej(new Error('img'))};
      img.src=fr.result;
    };
    fr.onerror=function(){rej(new Error('read'))};
    fr.readAsDataURL(file);
  });
}

function readProof(file){

  }catch(e){

  }

        var sn=x.name.trim();
        if(!sn){bad='Nama sub-kategori tidak boleh kosong.';return}
        if(sseen[sn.toLowerCase()])bad='Ada sub-kategori kembar di "'+n+'": '+sn+'.';
        sseen[sn.toLowerCase()]=1;
      });
    });
    if(bad){ce.textContent=bad;return}
    var keep={},newCats=catTmp.map(function(c){keep[c.id]=1;var o={id:c.id,name:c.name.trim(),icon:c.icon,subs:(c.subs||[]).map(function(x){var so={id:x.id,name:x.name.trim()};if(x.img)so.img=x.img;return so}),fields:c.fields||[]};if(c.img)o.img=c.img;o.desc=(c.desc||'').trim();o.region=c.region||'';return o});
    var removed=data().items.filter(function(i){return !keep[i.cat]});
    removed.forEach(function(i){delete cart[i.id]});persistCart();
    mutate(function(s){
      s.cats=newCats;s.items=s.items.filter(function(i){return keep[i.cat]});
      s.items.forEach(function(i){var cc=newCats.filter(function(x){return x.id===i.cat})[0];if(i.sub&&!(cc&&cc.subs.some(function(x){return x.id===i.sub})))i.sub=''});
    });
    closeModal();toast('Kategori diubah. Jangan lupa simpan.');
  }else if(f.id==='f-tx'){
    var te=document.getElementById('tx-err'),when=new Date(document.getElementById('tx-when').value).getTime();
    if(!when||isNaN(when)){te.textContent='Isi waktu transaksi.';return}
    var ls=txTmp.filter(function(r){return r.id&&itemById(r.id)}).map(function(r){return snapLine(itemById(r.id),Math.max(1,Math.min(99,parseInt(r.q,10)||1)))});
    if(!ls.length){te.textContent='Pilih minimal satu opsi.';return}
    var tx0={id:newTxId(),t:when,lines:ls,who:document.getElementById('tx-who').value.trim(),src:'manual',status:'done'};
    txInsert(tx0);
    closeModal();
  }else if(f.id==='f-regs'){
    var rge=document.getElementById('rg-err'),rbad='',rseen={};
    regTmp.forEach(function(r){
      var n=r.name.trim();
      if(!n){rbad='Nama region tidak boleh kosong.';return}
      if(rseen[n.toLowerCase()])rbad='Ada nama region yang kembar: '+n+'.';
      rseen[n.toLowerCase()]=1;
    });
    if(rbad){rge.textContent=rbad;return}
    var rkeep={},newRegs=regTmp.map(function(r){rkeep[r.id]=1;return {id:r.id,name:r.name.trim()}});
    mutate(function(s){s.regions=newRegs;s.cats.forEach(function(c){if(c.region&&!rkeep[c.region])c.region=''})});
    closeModal();toast('Region diubah. Jangan lupa simpan.');
  }else if(f.id==='f-flds'){
    var fe=document.getElementById('fl-err'),fbad='';
    data().cats.forEach(function(c){
      var fs={};
      (fldTmp[c.id]||[]).forEach(function(x){var n=x.label.trim();if(!n){fbad='Nama kolom di "'+c.name+'" tidak boleh kosong.';return}if(fs[n.toLowerCase()])fbad='Ada nama kolom kembar di "'+c.name+'": '+n+'.';fs[n.toLowerCase()]=1});
    });
    if(fbad){fe.textContent=fbad;return}
    var nfm={};data().cats.forEach(function(c){nfm[c.id]=(fldTmp[c.id]||[]).map(function(x){return {id:x.id,label:x.label.trim()}})});
    mutate(function(s){s.cats.forEach(function(c){c.fields=nfm[c.id]||[]})});
    closeModal();toast('Kolom pemesanan diubah. Jangan lupa simpan.');
  }else if(f.id==='f-shop'){
    var nm=document.getElementById('sh-name').value.trim();
    if(!nm){document.getElementById('sh-err').textContent='Nama toko wajib diisi.';return}
    var ebv=document.getElementById('sh-eb').value.trim();
    mutate(function(s){s.shop.name=nm;s.shop.tagline=document.getElementById('sh-tag').value.trim();s.shop.logo=logoTmp;s.shop.eyebrow=ebv});
    closeModal();toast('Info toko diubah. Jangan lupa simpan.');
  }else if(f.id==='f-pay'){
    var pe=document.getElementById('pm-err'),wd=document.getElementById('pm-wa').value.replace(/\D/g,'');
    if(wd.length<9||wd.length>15){pe.textContent='Nomor WhatsApp tidak valid.';return}
    if(wd.indexOf('0')===0)wd='62'+wd.slice(1);
    var accts=[],pbad='';
    payTmp.forEach(function(a){
      var b=(a.bank||'').trim(),n=(a.acct||'').trim(),h=(a.holder||'').trim();
      if(!b&&!n&&!h)return;
      if(!n){pbad='Nomor rekening wajib diisi di tiap rekening. Kosongkan semua kolomnya atau klik Hapus jika tidak dipakai.';return}
      accts.push({id:a.id,bank:b,acct:n,holder:h});
    });
    if(pbad){pe.textContent=pbad;return}
    var f0a=accts[0]||{bank:'',acct:'',holder:''};
    var pay={bank:f0a.bank,acct:f0a.acct,holder:f0a.holder,qr:qrTmp,accts:accts};
    mutate(function(s){s.shop.wa=wd;s.pay=pay});
    closeModal();toast('Pengaturan pembayaran diubah. Jangan lupa simpan.');
  }else if(f.id==='f-acct'){
    var er=document.getElementById('ac-err'),btn=document.getElementById('ac-go');er.textContent='';
    var p1=document.getElementById('ac-new').value,p2=document.getElementById('ac-new2').value;
    if(p1.length<8){er.textContent='Password baru minimal 8 karakter.';return}
    if(p1!==p2){er.textContent='Ulangi password baru dengan sama persis.';return}
    btn.disabled=true;
    var ur=await sb.auth.updateUser({password:p1});
    if(ur.error){er.textContent='Gagal mengganti password: '+ur.error.message;btn.disabled=false;return}
    closeModal();toast('Password diubah.');
  }
}
document.addEventListener('submit',function(ev){ev.preventDefault();handleForm(ev.target)});

boot();
})();</script>
</body></html>
